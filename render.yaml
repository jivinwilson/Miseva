services:
  - type: web
    name: miseva-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVER_PORT
        value: 8080
      - key: DB_SCHEMA
        value: miseva
      - key: DB_URL_PARAMS
        value: "&sslmode=require&prepareThreshold=0"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: postgres
      - key: DB_APP_USER
        sync: false
      - key: DB_APP_PASSWORD
        sync: false
      - key: DB_OWNER_USER
        sync: false
      - key: DB_OWNER_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MISEVA_CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: INVITATIONS_EXPOSE_LINK
        value: "false"
